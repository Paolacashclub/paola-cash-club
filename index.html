
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paola Cash Club</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff2f7;
      color: #743b59;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .card {
      background: white;
      padding: 35px 25px;
      margin: 20px;
      border-radius: 24px;
      box-shadow: 0 8px 25px #e9b9cc66;
      max-width: 360px;
    }

    h1 {
      color: #c45d91;
      font-size: 30px;
    }

    p {
      line-height: 1.6;
    }

    .heart {
      font-size: 45px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="heart">💗</div>
    <h1>Paola Cash Club</h1>
    <p>Benvenuta nel tuo club del risparmio!</p>
    <p>Ogni acquisto ti avvicina a un nuovo premio.</p>
    <strong>1 € speso = 1 punto</strong>
  </div>
</body>
</html>
